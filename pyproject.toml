[project]
name = "chomp3rs-bench"
version = "0.1.0"
description = "Benchmark comparison suite for the chomp3rs cubical homology crate"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "numpy>=2.5.3",
]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
