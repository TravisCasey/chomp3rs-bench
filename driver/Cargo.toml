[package]
name = "chomp3rs-driver"
version = "0.1.0"
edition = "2024"

[dependencies]
chomp3rs = { git = "https://github.com/TravisCasey/CHomP3-rs.git", rev = "2f15ddbcf96f9df2650000bf8265c28e782ce57a", version = "0.3.12", features = ["rayon"] }
clap = { version = "4.6.6", features = ["derive"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
